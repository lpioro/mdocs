{% extends 'base.html' %}{% block content %}
<div class="card mx-auto" style="max-width:400px"><div class="card-body"><h3>Logowanie</h3>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="form-label">Użytkownik</label><input name="username" class="form-control mb-3" required>
<label class="form-label">Hasło</label><input name="password" type="password" class="form-control mb-3" required>
<button class="btn btn-primary">Zaloguj</button></form></div></div>{% endblock %}
