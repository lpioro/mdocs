<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor Dokumentów</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--ink:#172b4d;--muted:#6d7f96;--line:#e6edf5;--blue:#326cf4;--bg:#f5f8fd}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.sidebar{background:#fff;border-right:1px solid var(--line);min-height:100vh;width:235px;position:fixed;top:0;left:0;padding:24px 14px}
.brand{font-size:1.15rem;font-weight:750;color:#1a3a64;text-decoration:none;letter-spacing:-.03em}
.brand-mark{background:#e6efff;color:var(--blue);border-radius:11px;padding:7px;margin-right:8px}
.navlink{display:block;padding:11px 14px;border-radius:10px;color:#64758e;text-decoration:none;font-size:.92rem;margin-top:6px}
.navlink:hover,.navlink.active{background:#edf3ff;color:#245bc6;font-weight:650}
.page{margin-left:235px;padding:26px 36px;max-width:1700px}
.panel{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:0 3px 18px rgba(33,72,128,.035)}
.panel-title{font-size:1rem;font-weight:700;margin:0}
.kpi-label{font-size:.82rem;color:var(--muted)}.kpi-num{font-size:2rem;font-weight:760;letter-spacing:-.04em}
.kpi-icon{height:42px;width:42px;border-radius:12px;display:grid;place-items:center;background:#eaf2ff;color:#2463e5;font-size:1.2rem}
.btn-primary{background:#326cf4;border-color:#326cf4}
.table{--bs-table-bg:transparent;color:var(--ink)}.table thead th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:#7d8ca0;border-bottom-color:var(--line);padding:12px}
.table tbody td{padding:14px 12px;border-bottom-color:#edf1f7;font-size:.89rem}
.pill{border-radius:40px;font-weight:650;font-size:.74rem;padding:5px 9px;display:inline-block}
.pill-green{background:#e4f8ec;color:#218451}.pill-yellow{background:#fff5dc;color:#9a6c07}.pill-red{background:#ffeded;color:#c34444}.pill-blue{background:#eaf2ff;color:#2765cf}
.subtitle{color:var(--muted);font-size:.87rem}.avatar{display:inline-grid;place-items:center;height:32px;width:32px;border-radius:10px;background:#eaf1fb;color:#396db2;font-weight:750;margin-right:9px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}
.mini-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
@media(max-width:991px){.sidebar{position:static;width:auto;min-height:auto;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line)}.sidebar .navlinks{display:flex;gap:6px;flex-wrap:wrap}.page{margin:0;padding:20px 14px}.brand{display:inline-block;margin-bottom:6px}}
</style></head>
<body><aside class="sidebar">
<a class="brand" href="{{ url_for('main.dashboard') }}"><span class="brand-mark">▦</span> Monitor Docs</a>
<div class="small text-secondary mt-2 mb-4 ms-2">Panel biura rachunkowego</div>
<div class="navlinks">
<a class="navlink {% if request.endpoint == 'main.dashboard' %}active{% endif %}" href="{{ url_for('main.dashboard') }}">▦ &nbsp; Dashboard</a>
<a class="navlink {% if request.endpoint in ['main.clients','main.client'] %}active{% endif %}" href="{{ url_for('main.clients') }}">♧ &nbsp; Klienci</a>
<a class="navlink" href="{{ url_for('main.dashboard') }}#inbox">✉ &nbsp; Wiadomości</a>
<a class="navlink" href="{{ url_for('main.dashboard') }}#documents">▤ &nbsp; Dokumenty</a>
<a class="navlink" href="{{ url_for('main.dashboard') }}#unknown">◉ &nbsp; Nieznani nadawcy</a>
</div>
{% if current_user.is_authenticated %}<hr class="my-4"><form method="post" action="{{ url_for('main.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-secondary w-100">Wyloguj</button></form>{% endif %}
</aside>
<main class="page">
{% for category, msg in get_flashed_messages(with_categories=True) %}<div class="alert alert-{{ category }}">{{ msg }}</div>{% endfor %}
{% block content %}{% endblock %}
</main></body></html>
