<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor Dokumentów</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container">
<a class="navbar-brand" href="{{ url_for('main.dashboard') }}">Monitor Dokumentów</a>
<div><a href="{{ url_for('main.clients') }}" class="btn btn-outline-light btn-sm">Klienci</a>
{% if current_user.is_authenticated %}<form action="{{ url_for('main.logout') }}" method="post" class="d-inline">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-light btn-sm">Wyloguj</button></form>{% endif %}</div>
</div></nav><main class="container py-4">
{% for category, msg in get_flashed_messages(with_categories=True) %}<div class="alert alert-{{ category }}">{{ msg }}</div>{% endfor %}
{% block content %}{% endblock %}</main></body></html>
